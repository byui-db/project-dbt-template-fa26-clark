# ITM327 dbt connection profile
# Our three layers: RAW (source, read-only) → STAGING → MODELED
#   RAW      — Airflow writes here; dbt only reads (declared as a source)
#   STAGING  — dbt's dev/build environment   → target: dev   (default)
#   MODELED  — dbt's production environment   → target: prod
#
# Note: the dbt demo video names its targets "dev" and "prod" — we keep those
# target names so the video's commands work as-is, but they write to our
# STAGING and MODELED schemas, not schemas literally named DEV/PROD.
itm327:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: STUDENT
      database: PROJECT_DB
      schema: STAGING
      warehouse: STUDENT_WH
    prod:
      type: snowflake
      account: 'not needed'
      user: 'not needed'
      role: STUDENT
      database: PROJECT_DB
      schema: MODELED
      warehouse: STUDENT_WH
