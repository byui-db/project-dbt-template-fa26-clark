version: 2

models:

  # NEWS: single-column primary key (id)
  - name: raw_news
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: symbol
        tests:
          - not_null
      - name: published_at
        tests:
          - not_null
      - name: headline
        tests:
          - not_null

  # STOCKS: composite key (symbol + trade_date), declared at the MODEL level
  - name: raw_stocks
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - trade_date
    columns:
      - name: symbol
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
      - name: close
        tests:
          - not_null

  # WEATHER: composite key (city + date), declared at the MODEL level
  - name: raw_weather
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - city
            - date
    columns:
      - name: city
        tests:
          - not_null
      - name: date
        tests:
          - not_null
